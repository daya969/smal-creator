<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صناع محتوى الصغار</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 550px; margin: 0 auto; background: #fff; padding: 20px; border: 1px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: #2c3e50; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; }
        button { background: #3498db; color: #fff; padding: 10px; border: none; width: 100%; cursor: pointer; font-size: 16px; border-radius: 4px; }
        button:hover { background: #2980b9; }
        .hidden { display: none; }
        .link-box { background: #e8f8f5; padding: 10px; border: 1px solid #a3e4d7; margin-top: 15px; word-break: break-all; font-size: 14px; }
        .profile-card { text-align: center; background: #fafafa; padding: 15px; border: 1px solid #e1e1e1; margin-top: 15px; border-radius: 6px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #3498db; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>صناع محتوى الصغار</h2>

    <!-- 1. نموذج تقديم الطلب (فارغ بالكامل) -->
    <div id="formSection">
        <h3>تقديم طلب انضمام جديد</h3>
        <form id="creatorForm" onsubmit="submitForm(event)">
            <div class="group">
                <label>اسم صانع المحتوى:</label>
                <input type="text" id="name" required placeholder="اكتب اسمك أو اسم قناتك">
            </div>
            <div class="group">
                <label>اختر الفئة:</label>
                <select id="category">
                    <option value="تعليم">تعليم</option>
                    <option value="ترفيه">ترفيه</option>
                    <option value="ألعاب">ألعاب</option>
                    <option value="رسم وتصميم">رسم وتصميم</option>
                    <option value="تحديات">تحديات</option>
                </select>
            </div>
            <div class="group">
                <label>رابط القناة أو وسائل التواصل:</label>
                <input type="url" id="channel_link" required placeholder="https://...">
            </div>
            <div class="group">
                <label>نبذة بسيطة:</label>
                <textarea id="bio" rows="3" placeholder="اكتب وصفاً قصيراً لمحتواك..."></textarea>
            </div>
            <button type="submit">إرسال الطلب</button>
        </form>
    </div>

    <!-- 2. قسم عرض بروفايل صانع المحتوى ورابطه الخاص (يظهر بعد الإرسال أو عند الدخول من رابطه) -->
    <div id="profileSection" class="hidden">
        <div class="profile-card">
            <img id="pImg" src="https://via.placeholder.com/100" class="profile-img" alt="صورة الصانع">
            <h3 id="pName"></h3>
            <p><strong>الفئة:</strong> <span id="pCategory"></span></p>
            <p id="pBio"></p>
            <hr>
            <h4>عدد الأصوات الحالية: <span id="pVotes" style="color: #27ae60;">0</span></h4>
            <!-- زر التصويت المباشر داخل الموقع الرئيسي -->
            <button onclick="voteForCreator()" style="background-color: #27ae60; margin-top: 5px;">صوت لهذا الصانع ⭐</button>
        </div>

        <!-- رابط المشترك ليقوم بنسخه وترويجه لجلب المتابعين إلى الموقع الرئيسي -->
        <div class="link-box">
            <strong>رابط صفحتك الخاص (انسخه وارسله لمتابديك ليدخلوا ويصوتوا لك هنا):</strong><br>
            <span id="shareLinkText" style="color: #007bff; font-weight: bold;"></span>
        </div>
        
        <button onclick="location.reload()" style="background-color: #7f8c8d; margin-top: 15px;">تقديم طلب جديد / العودة</button>
    </div>

</div>

<script>
    // ضع بيانات قاعدة بيانات Supabase الخاصة بك هنا
    const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WMXdY6zPBOcxseG1CHRYeA_5W1pEa1Q';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeCreatorId = null;

    // إرسال الطلب وحفظه في قاعدة البيانات
    async function submitForm(e) {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const category = document.getElementById('category').value;
        const channel_link = document.getElementById('channel_link').value;
        const bio = document.getElementById('bio').value;

        const { data, error } = await supabaseClient
            .from('creators')
            .insert([{ 
                name, 
                category, 
                channel_link, 
                bio, 
                votes: 0,
                image_url: '' // الصورة تضعها أنت لاحقاً من موقع الإدارة الخاص بك
            }])
            .select();

        if (error) {
            alert('حدث خطأ أثناء الإرسال: ' + error.message);
            return;
        }

        if (data && data.length > 0) {
            activeCreatorId = data[0].id;
            displayProfile(data[0]);
        }
    }

    // عرض بيانات الصانع ورابطه الشخصي داخل الموقع الرئيسي
    function displayProfile(creator) {
        document.getElementById('formSection').classList.add('hidden');
        document.getElementById('profileSection').classList.remove('hidden');

        document.getElementById('pName').innerText = creator.name;
        document.getElementById('pCategory').innerText = creator.category;
        document.getElementById('pBio').innerText = creator.bio || '';
        document.getElementById('pVotes').innerText = creator.votes || 0;
        
        if (creator.image_url) {
            document.getElementById('pImg').src = creator.image_url;
        }

        // إنشاء الرابط الخاص بالمشترك ليرسله للناس ليأتوا إلى نفس الموقع الرئيسي
        const shareUrl = window.location.origin + window.location.pathname + '?id=' + creator.id;
        document.getElementById('shareLinkText').innerText = shareUrl;
    }

    // دالة التصويت المباشر من داخل الموقع الرئيسي
    async function voteForCreator() {
        if (!activeCreatorId) return;

        // جلب عدد الأصوات الحالي من قاعدة البيانات
        const { data, error: fetchError } = await supabaseClient
            .from('creators')
            .select('votes')
            .eq('id', activeCreatorId)
            .single();

        if (fetchError) {
            alert('خطأ في جلب بيانات التصويت.');
            return;
        }

        const newVotes = (data.votes || 0) + 1;

        // تحديث الأصوات في قاعدة البيانات (لتظهر فوراً في موقع الإدارة لديك)
        const { error: updateError } = await supabaseClient
            .from('creators')
            .update({ votes: newVotes })
            .eq('id', activeCreatorId);

        if (!updateError) {
            document.getElementById('pVotes').innerText = newVotes;
            alert('تم تسجيل صوتك بنجاح داخل الموقع! شكراً لك.');
        } else {
            alert('حدث خطأ أثناء إتمام التصويت.');
        }
    }

    // عند فتح الموقع بواسطة رابط مشاركة المشترك (للإتيان بالمتابعين إلى الموقع الرئيسي مباشرة)
    window.onload = async function() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (id) {
            activeCreatorId = id;
            const { data, error } = await supabaseClient
                .from('creators')
                .select('*')
                .eq('id', id)
                .single();

            if (data) {
                displayProfile(data);
            } else {
                alert('عذراً، هذا الصانع غير موجود أو تم حذف طلبه.');
            }
        }
    };
</script>

</body>
</html>
